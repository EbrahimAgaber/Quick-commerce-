<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B253F" />
      <stop offset="60%" stop-color="#071829" />
      <stop offset="100%" stop-color="#040D17" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glowing accent circle top right -->
  <circle cx="680" cy="120" r="180" fill="#F59E0B" opacity="0.12" filter="blur(40px)" />
  <circle cx="120" cy="480" r="140" fill="#FBBF24" opacity="0.08" filter="blur(40px)" />

  <!-- Top Brand Navigation Bar inside thumbnail -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#F59E0B" />
    <text x="16" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">S</text>
    <text x="44" y="22" fill="#E2E8F0" font-family="Cairo, system-ui, sans-serif" font-size="14" font-weight="700">SIMPLER STORE</text>
    
    <!-- Category Pill Badge -->
    <rect x="420" y="2" width="260" height="28" rx="14" fill="#F59E0B" />
    <text x="550" y="20" fill="#451A03" font-family="Cairo, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DESKTOP APP · نقاط البيع</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(60, 160)">
    <!-- English Title -->
    <text x="0" y="24" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1">POS DESKTOP RETAIL</text>
    
    <!-- Arabic Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="Cairo, system-ui, sans-serif" font-size="34" font-weight="800">برنامج الكاشير ونقاط البيع</text>
    
    <!-- Arabic Subtitle / Description -->
    <text x="0" y="125" fill="#94A3B8" font-family="Cairo, system-ui, sans-serif" font-size="15" font-weight="400">
      سرعة فائقة دون انقطاع مع دعم الباركود وطباعة الإيصالات
    </text>

    <!-- Specs & Highlights Pills -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#F59E0B" />
      <text x="32" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">تسليم فوري</text>

      <rect x="145" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="163" cy="17" r="4" fill="#10B981" />
      <text x="177" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">دعم وضمان</text>

      <rect x="290" y="0" width="115" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="308" cy="17" r="4" fill="#38BDF8" />
      <text x="322" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">كود أصلي</text>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(0, 245)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="25" fill="#64748B" font-family="Cairo, system-ui, sans-serif" font-size="12">
        بواسطة م. جابر · متوافق مع كافة الأنظمة الحديثة
      </text>
    </g>
  </g>

  <!-- Right Graphic Element -->
  <g filter="url(#shadow)">
    
        <!-- POS Desktop Graphic -->
        <rect x="520" y="160" width="220" height="150" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
        <rect x="535" y="175" width="190" height="90" rx="6" fill="#0B132B" />
        <rect x="545" y="185" width="50" height="30" rx="4" fill="#F59E0B" opacity="0.8" />
        <rect x="605" y="185" width="50" height="30" rx="4" fill="#334155" />
        <rect x="665" y="185" width="50" height="30" rx="4" fill="#334155" />
        <rect x="545" y="225" width="50" height="30" rx="4" fill="#334155" />
        <rect x="605" y="225" width="50" height="30" rx="4" fill="#334155" />
        <rect x="665" y="225" width="50" height="30" rx="4" fill="#10B981" />
        <!-- Stand & Barcode Scanner -->
        <polygon points="610,310 650,310 660,360 600,360" fill="#334155" />
        <rect x="570" y="360" width="120" height="14" rx="4" fill="#475569" />
        <!-- Receipt Tape -->
        <rect x="550" y="330" width="60" height="90" rx="4" fill="#F8FAFC" />
        <line x1="560" y1="345" x2="600" y2="345" stroke="#CBD5E1" stroke-width="2" />
        <line x1="560" y1="360" x2="590" y2="360" stroke="#CBD5E1" stroke-width="2" />
        <line x1="560" y1="375" x2="600" y2="375" stroke="#CBD5E1" stroke-width="2" />
      
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="594" width="800" height="6" fill="#F59E0B" />
</svg>
