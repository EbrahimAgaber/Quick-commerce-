<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B253F" />
      <stop offset="60%" stop-color="#071829" />
      <stop offset="100%" stop-color="#040D17" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glowing accent circle top right -->
  <circle cx="680" cy="120" r="180" fill="#EA580C" opacity="0.12" filter="blur(40px)" />
  <circle cx="120" cy="480" r="140" fill="#FB923C" opacity="0.08" filter="blur(40px)" />

  <!-- Top Brand Navigation Bar inside thumbnail -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#EA580C" />
    <text x="16" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">S</text>
    <text x="44" y="22" fill="#E2E8F0" font-family="Cairo, system-ui, sans-serif" font-size="14" font-weight="700">SIMPLER STORE</text>
    
    <!-- Category Pill Badge -->
    <rect x="420" y="2" width="260" height="28" rx="14" fill="#F97316" />
    <text x="550" y="20" fill="#FFFFFF" font-family="Cairo, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CREATIVE PACK · قوالب سيناريو</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(60, 160)">
    <!-- English Title -->
    <text x="0" y="24" fill="#FB923C" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1">PROMO STORYBOARD PACK</text>
    
    <!-- Arabic Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="Cairo, system-ui, sans-serif" font-size="34" font-weight="800">باقة لوحات الفيديو الترويجي</text>
    
    <!-- Arabic Subtitle / Description -->
    <text x="0" y="125" fill="#94A3B8" font-family="Cairo, system-ui, sans-serif" font-size="15" font-weight="400">
      قوالب سيناريو بصرية احترافية لإنتاج إعلانات الفيديو الرقمية
    </text>

    <!-- Specs & Highlights Pills -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#EA580C" />
      <text x="32" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">تسليم فوري</text>

      <rect x="145" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="163" cy="17" r="4" fill="#10B981" />
      <text x="177" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">دعم وضمان</text>

      <rect x="290" y="0" width="115" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="308" cy="17" r="4" fill="#38BDF8" />
      <text x="322" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">كود أصلي</text>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(0, 245)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="25" fill="#64748B" font-family="Cairo, system-ui, sans-serif" font-size="12">
        بواسطة م. جابر · متوافق مع كافة الأنظمة الحديثة
      </text>
    </g>
  </g>

  <!-- Right Graphic Element -->
  <g filter="url(#shadow)">
    
        <!-- Storyboard frames Graphic -->
        <g transform="translate(510, 160)">
          <!-- Frame 1 -->
          <rect x="10" y="10" width="100" height="70" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
          <polygon points="45,35 45,55 65,45" fill="#FB923C" />
          <!-- Frame 2 -->
          <rect x="120" y="10" width="100" height="70" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
          <line x1="135" y1="45" x2="205" y2="45" stroke="#FB923C" stroke-width="3" />
          <circle cx="170" cy="45" r="8" fill="#EA580C" />
          <!-- Frame 3 -->
          <rect x="10" y="95" width="100" height="70" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
          <rect x="25" y="110" width="70" height="40" rx="4" fill="#0F172A" />
          <!-- Frame 4 -->
          <rect x="120" y="95" width="100" height="70" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
          <path d="M 135 145 L 160 120 L 180 135 L 205 110" fill="none" stroke="#FB923C" stroke-width="2.5" />
          <!-- Timeline ruler -->
          <rect x="10" y="185" width="210" height="35" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1.5" />
          <line x1="30" y1="185" x2="30" y2="205" stroke="#EA580C" stroke-width="2" />
          <line x1="80" y1="185" x2="80" y2="200" stroke="#64748B" stroke-width="1.5" />
          <line x1="130" y1="185" x2="130" y2="205" stroke="#FB923C" stroke-width="2" />
          <line x1="180" y1="185" x2="180" y2="200" stroke="#64748B" stroke-width="1.5" />
        </g>
      
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="594" width="800" height="6" fill="#EA580C" />
</svg>
