<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B253F" />
      <stop offset="60%" stop-color="#071829" />
      <stop offset="100%" stop-color="#040D17" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glowing accent circle top right -->
  <circle cx="680" cy="120" r="180" fill="#0284C7" opacity="0.12" filter="blur(40px)" />
  <circle cx="120" cy="480" r="140" fill="#38BDF8" opacity="0.08" filter="blur(40px)" />

  <!-- Top Brand Navigation Bar inside thumbnail -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#0284C7" />
    <text x="16" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">S</text>
    <text x="44" y="22" fill="#E2E8F0" font-family="Cairo, system-ui, sans-serif" font-size="14" font-weight="700">SIMPLER STORE</text>
    
    <!-- Category Pill Badge -->
    <rect x="420" y="2" width="260" height="28" rx="14" fill="#0284C7" />
    <text x="550" y="20" fill="#FFFFFF" font-family="Cairo, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ENGINEERING MANUAL · مرجع عملي</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(60, 160)">
    <!-- English Title -->
    <text x="0" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1">EQUIPMENT SIZING MANUAL</text>
    
    <!-- Arabic Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="Cairo, system-ui, sans-serif" font-size="34" font-weight="800">كتاب: دليل تحجيم المعدات الصناعية</text>
    
    <!-- Arabic Subtitle / Description -->
    <text x="0" y="125" fill="#94A3B8" font-family="Cairo, system-ui, sans-serif" font-size="15" font-weight="400">
      حسابات وتصاميم المضخات والأوعية والمبادلات مع ملفات إكسل
    </text>

    <!-- Specs & Highlights Pills -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#0284C7" />
      <text x="32" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">تسليم فوري</text>

      <rect x="145" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="163" cy="17" r="4" fill="#10B981" />
      <text x="177" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">دعم وضمان</text>

      <rect x="290" y="0" width="115" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="308" cy="17" r="4" fill="#38BDF8" />
      <text x="322" y="22" fill="#E2E8F0" font-family="Cairo, sans-serif" font-size="12" font-weight="600">كود أصلي</text>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(0, 245)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="25" fill="#64748B" font-family="Cairo, system-ui, sans-serif" font-size="12">
        بواسطة م. جابر · متوافق مع كافة الأنظمة الحديثة
      </text>
    </g>
  </g>

  <!-- Right Graphic Element -->
  <g filter="url(#shadow)">
    
        <!-- Equipment Sizing Manual Graphic -->
        <g transform="translate(520, 150)">
          <!-- Blueprint grid background -->
          <rect x="10" y="10" width="190" height="265" rx="10" fill="#082F49" stroke="#0284C7" stroke-width="2.5" />
          <!-- Blueprint grid lines -->
          <line x1="10" y1="60" x2="200" y2="60" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" />
          <line x1="10" y1="120" x2="200" y2="120" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" />
          <line x1="10" y1="180" x2="200" y2="180" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" />
          <line x1="60" y1="10" x2="60" y2="275" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" />
          <line x1="120" y1="10" x2="120" y2="275" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" />
          <!-- Centrifugal pump schematic -->
          <circle cx="105" cy="115" r="35" fill="none" stroke="#38BDF8" stroke-width="3" />
          <circle cx="105" cy="115" r="10" fill="#38BDF8" />
          <line x1="105" y1="80" x2="175" y2="80" stroke="#38BDF8" stroke-width="3" />
          <polygon points="170,75 180,80 170,85" fill="#38BDF8" />
          <line x1="105" y1="150" x2="105" y2="175" stroke="#38BDF8" stroke-width="3" />
          <!-- Formula snippet -->
          <rect x="25" y="210" width="160" height="45" rx="6" fill="#0C4A6E" />
          <text x="105" y="232" fill="#BAE6FD" font-size="11" font-family="monospace" text-anchor="middle">NPSHa &gt; NPSHr + 0.5m</text>
          <text x="105" y="247" fill="#7DD3FC" font-size="9" text-anchor="middle">ASME / API 610 STANDARDS</text>
        </g>
      
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="594" width="800" height="6" fill="#0284C7" />
</svg>
